# Data contract for RAW.LISTENING_EVENTS — version 1.0.0
#
# This file IS the contract. It is versioned in Git and a change to it is a
# reviewable pull request, not a setting edited in a UI. validate_batch.py holds
# no rules of its own; it only executes what is declared here.
#
# severity:
#   critical -> offending rows are quarantined; batch rejected past max_quarantine_ratio
#   high     -> offending rows are quarantined
#   medium   -> recorded as a warning, rows still load
# scope:
#   table    -> failure rejects the whole batch (schema is not a per-row property)
#   row      -> failure quarantines the offending rows

contract_version: "1.0.0"
dataset: RAW.LISTENING_EVENTS
max_quarantine_ratio: 0.05

columns:
  - {name: event_id,     dtype: string,   required: true}
  - {name: user_id,      dtype: string,   required: true}
  - {name: session_id,   dtype: string,   required: true}
  - {name: song_id,      dtype: string,   required: true}
  - {name: artist_id,    dtype: string,   required: true}
  - {name: genre,        dtype: string,   required: true}
  - {name: event_type,   dtype: string,   required: true}
  - {name: event_ts,     dtype: datetime, required: true}
  - {name: duration_ms,  dtype: integer,  required: true}
  - {name: ms_played,    dtype: integer,  required: true}
  - {name: device_type,  dtype: string,   required: false}
  - {name: country,      dtype: string,   required: false}
  - {name: _ingested_at, dtype: datetime, required: true}
  - {name: _source_file, dtype: string,   required: false}

expectations:
  - id: schema_columns_present
    scope: table
    severity: critical
    kind: columns_exist

  - id: schema_types_match
    scope: table
    severity: critical
    kind: column_types

  - {id: event_id_not_null,    scope: row, severity: critical, kind: not_null,     column: event_id}
  - {id: event_id_unique,      scope: row, severity: critical, kind: unique,       column: event_id}
  - {id: user_id_not_null,     scope: row, severity: critical, kind: not_null,     column: user_id}
  - {id: session_id_not_null,  scope: row, severity: critical, kind: not_null,     column: session_id}
  - {id: song_id_not_null,     scope: row, severity: critical, kind: not_null,     column: song_id}
  - {id: artist_id_not_null,   scope: row, severity: critical, kind: not_null,     column: artist_id}

  - {id: user_id_format,       scope: row, severity: high,     kind: regex,        column: user_id,    pattern: '^U[0-9]{6}$'}
  - {id: song_id_format,       scope: row, severity: high,     kind: regex,        column: song_id,    pattern: '^S[0-9]{5}$'}
  - {id: country_format,       scope: row, severity: medium,   kind: regex,        column: country,    pattern: '^[A-Z]{2}$'}

  - {id: event_type_allowed,   scope: row, severity: critical, kind: in_set,       column: event_type, values: [play, skip, pause, replay, like]}
  - {id: genre_allowed,        scope: row, severity: high,     kind: in_set,       column: genre,
     values: [pop, rock, indie_rock, hip_hop, electronic, reggaeton, jazz, classical, metal, r_and_b, country, latin]}
  - {id: device_allowed,       scope: row, severity: medium,   kind: in_set,       column: device_type, values: [mobile, desktop, web, smart_speaker]}

  - {id: duration_range,       scope: row, severity: critical, kind: between,      column: duration_ms, min: 30000, max: 900000}
  - {id: ms_played_range,      scope: row, severity: critical, kind: between,      column: ms_played,   min: 0,     max: 900000}
  - {id: event_ts_range,       scope: row, severity: critical, kind: between_dates, column: event_ts,   min: '2024-01-01', max: now}

  # Domain invariants: relations between columns, not properties of one column.
  - {id: ms_played_le_duration, scope: row, severity: critical, kind: pair_a_le_b, column_a: ms_played, column_b: duration_ms}
  - {id: skip_under_80pct,      scope: row, severity: high,     kind: conditional_ratio_lt,
     when_column: event_type, when_value: skip, numerator: ms_played, denominator: duration_ms, threshold: 0.8}
